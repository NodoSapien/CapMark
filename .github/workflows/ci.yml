name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm run build

  backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar PostgreSQL
        run: docker compose --env-file .env.example -f infra/docker-compose.yml up -d db

      - name: Ejecutar smoke test de base de datos
        run: ./scripts/smoke-test-db.sh

      - name: Volcar logs de base de datos si falla
        if: failure()
        run: docker compose --env-file .env.example -f infra/docker-compose.yml logs db

      - name: Desmontar backend y volúmenes
        if: always()
        run: docker compose --env-file .env.example -f infra/docker-compose.yml down -v
